name: Build SmartFit mobile (EAS)

on:
  # On every push — exactly what you asked for: every commit queues a build.
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production
      platform:
        description: "Platform to build"
        required: false
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      wait:
        description: "Wait for build to finish (false = fire-and-forget)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      submit:
        description: "Submit to Play Store after build (only for production)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  # One EAS build per ref at a time; cancel older queued runs to save credits.
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS ${{ github.event.inputs.profile || 'preview' }} / ${{ github.event.inputs.platform || 'android' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify EXPO_TOKEN secret is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create a personal/robot access token at https://expo.dev/settings/access-tokens and add it to GitHub secrets."
            exit 1
          fi
          echo "EXPO_TOKEN present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS CLI
        run: npm install -g eas-cli@latest

      - name: Show EAS account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "EXPO_TOKEN length: ${#EXPO_TOKEN}"
          cd apps/mobile
          eas whoami

      - name: Trigger EAS build
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
          EAS_NO_VCS: '1'
        run: |
          set -x
          cd apps/mobile
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          PLATFORM="${{ github.event.inputs.platform || 'android' }}"
          WAIT="${{ github.event.inputs.wait }}"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          MESSAGE="$(git -C "$GITHUB_WORKSPACE" log -1 --pretty=%s | cut -c1-140) ($SHORT_SHA)"
          node --version
          which eas
          eas --version
          eas whoami
          ls -la eas.json app.config.js
          if [ "$WAIT" = "true" ]; then
            eas build \
              --profile "$PROFILE" \
              --platform "$PLATFORM" \
              --message "$MESSAGE" \
              --non-interactive \
              --wait
          else
            # Capture both stdout+stderr so we can surface the exact error in
            # the job summary (GitHub's log download is intermittently 503ing).
            set +e
            eas build \
              --profile "$PROFILE" \
              --platform "$PLATFORM" \
              --message "$MESSAGE" \
              --non-interactive \
              --no-wait \
              --json > "$RUNNER_TEMP/eas-build.out" 2>&1
            EAS_EXIT=$?
            set -e

            EXPO_ACCOUNT="mouadlouhichi"
            EXPO_PROJECT="smartfit"
            export EXPO_ACCOUNT EXPO_PROJECT EAS_EXIT
            node -e '
              var fs = require("fs");
              var acct = process.env.EXPO_ACCOUNT;
              var proj = process.env.EXPO_PROJECT;
              var exitCode = process.env.EAS_EXIT || "?";
              var raw = "";
              try { raw = fs.readFileSync(process.env.RUNNER_TEMP + "/eas-build.out", "utf8"); } catch(e){ raw = ""; }

              // Strip any ANSI / control chars so the summary renders cleanly.
              var clean = raw.replace(/\x1B\[[0-9;]*[A-Za-z]/g, "").replace(/\r/g, "");

              // Try to locate the JSON payload (the CLI can emit log lines
              // before the JSON when DEBUG is on or there are warnings).
              var builds = [];
              var lastArr = clean.lastIndexOf("[");
              var lastObj = clean.lastIndexOf("{");
              var parseStart = Math.max(lastArr, lastObj);
              if (parseStart >= 0) {
                var candidate = clean.slice(parseStart);
                try {
                  var parsed = JSON.parse(candidate);
                  builds = Array.isArray(parsed) ? parsed : [parsed];
                } catch(e){
                  // try shorter slices
                  for (var i = parseStart + 1; i < clean.length; i++) {
                    var ch = clean[i];
                    if (ch === "[" || ch === "{") {
                      try {
                        var p = JSON.parse(clean.slice(i));
                        builds = Array.isArray(p) ? p : [p];
                        break;
                      } catch(ee){}
                    }
                  }
                }
              }
              var lines = builds.filter(function(b){ return b && b.id; }).map(function(b){
                var prof = b.buildProfile || b.profile || "preview";
                var plat = b.platform || "?";
                return "- **" + plat + "** `" + prof + "` — [" + b.id + "](https://expo.dev/accounts/" + acct + "/projects/" + proj + "/builds/" + b.id + ")";
              });

              var md = "## EAS build\n\n- Exit code: `" + exitCode + "`\n\n";
              if (lines.length) {
                md += "### ✅ Builds queued\n\n" + lines.join("\n") + "\n\n";
                md += "All builds: https://expo.dev/accounts/" + acct + "/projects/" + proj + "/builds\n";
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
                fs.appendFileSync(process.env.GITHUB_OUTPUT, "build_id=" + builds[0].id + "\n");
                console.log("Builds queued:");
                lines.forEach(function(l){ console.log(l); });
                process.exit(0);
              }
              md += "### ❌ No build id returned\n\n";
              md += "Last 4KB of EAS output:\n\n```\n";
              md += (clean.slice(-4000) || "(empty)") + "\n```\n";
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
              console.log(clean);
              process.exit(parseInt(exitCode, 10) || 1);
            '
          fi

  submit:
    name: Submit to Play Store
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.profile == 'production' && github.event.inputs.submit == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS CLI
        run: npm install -g eas-cli@latest

      - name: Restore Play Console service account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          cd apps/mobile
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is missing (contents of pc-api-key.json)."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > pc-api-key.json

      - name: Submit latest build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd apps/mobile
          eas submit --profile production --platform android --latest --non-interactive
