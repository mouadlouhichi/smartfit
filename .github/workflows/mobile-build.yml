name: EAS Build

# Matches the smartjib working pattern: every commit queues a build on EAS
# (fire-and-forget with --no-wait so the build appears on the dashboard
# instantly, then runs server-side). Builds show up at:
#   https://expo.dev/accounts/mouadlouhichi/projects/smartfit/builds
#
# Escape hatch: put [skip eas] or [skip ci] in the commit message.

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: preview
        type: choice
        options: [development, preview, production]
      platform:
        description: Target platform
        required: true
        default: android
        type: choice
        options: [android, ios, all]
      wait:
        description: Wait for the build to finish (uses CI minutes)
        required: false
        default: false
        type: boolean
      submit:
        description: Submit to Play Store after a production build
        required: false
        default: false
        type: boolean

concurrency:
  # Cancel queued superseded builds when you push in rapid succession.
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROFILE: ${{ github.event.inputs.profile || 'preview' }}
  PLATFORM: ${{ github.event.inputs.platform || 'android' }}
  EXPO_ACCOUNT: mouadlouhichi
  EXPO_PROJECT: smartfit

jobs:
  build:
    name: EAS ${{ github.event.inputs.profile || 'preview' }} / ${{ github.event.inputs.platform || 'android' }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'push' ||
      (
        !contains(github.event.head_commit.message, '[skip eas]') &&
        !contains(github.event.head_commit.message, '[skip ci]')
      )
    steps:
      - name: Verify EXPO_TOKEN secret is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is missing."
            echo "::error::Add it with: gh secret set EXPO_TOKEN --body '<token>'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          expo-cache: true
          working-directory: apps/mobile

      - name: Show EAS account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "EXPO_TOKEN length: ${#EXPO_TOKEN}"
          eas whoami
        working-directory: apps/mobile

      - name: Trigger EAS build
        id: eas
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ACCOUNT: mouadlouhichi
          EXPO_PROJECT: smartfit
        run: |
          set -euo pipefail
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          PLATFORM="${{ github.event.inputs.platform || 'android' }}"
          WAIT="${{ github.event.inputs.wait }}"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          MESSAGE="$(git -C "$GITHUB_WORKSPACE" log -1 --pretty=%s | cut -c1-140) ($SHORT_SHA)"
          echo "Profile : $PROFILE"
          echo "Platform: $PLATFORM"
          echo "Message : $MESSAGE"
          if [ "$WAIT" = "true" ]; then
            eas build \
              --profile "$PROFILE" \
              --platform "$PLATFORM" \
              --message "$MESSAGE" \
              --non-interactive \
              --wait
          else
            set -x
            # Capture both stdout and stderr, but don't fail on pipe errors
            # until we've dumped any response body the CLI printed.
            eas build \
              --profile "$PROFILE" \
              --platform "$PLATFORM" \
              --message "$MESSAGE" \
              --non-interactive \
              --no-wait \
              --json > "$RUNNER_TEMP/eas-build.json" 2> "$RUNNER_TEMP/eas-build.err"
            EAS_EXIT=$?
            set +x
            echo "---- eas build stderr ----"
            cat "$RUNNER_TEMP/eas-build.err"
            echo "---- eas build stdout ----"
            head -c 4000 "$RUNNER_TEMP/eas-build.json"
            echo
            echo "---- exit code: $EAS_EXIT ----"
            if [ "$EAS_EXIT" != "0" ]; then exit "$EAS_EXIT"; fi
            node -e '
              const fs = require("fs");
              const out = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/eas-build.json", "utf8"));
              const builds = Array.isArray(out) ? out : [out];
              const account = process.env.EXPO_ACCOUNT;
              const project = process.env.EXPO_PROJECT;
              const lines = builds.map(function(b){
                var prof = b.buildProfile || "preview";
                return "- **" + b.platform + "** `" + prof + "` — [" + b.id + "](https://expo.dev/accounts/" + account + "/projects/" + project + "/builds/" + b.id + ")";
              });
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                "## EAS builds queued\n\n" + lines.join("\n") + "\n\nAll builds: https://expo.dev/accounts/" + account + "/projects/" + project + "/builds\n");
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "build_id=" + ((builds[0] && builds[0].id) || "") + "\n");
            '
          fi

      - name: Link to dashboard
        if: always()
        run: |
          echo "Builds: https://expo.dev/accounts/${EXPO_ACCOUNT}/projects/${EXPO_PROJECT}/builds"

  submit:
    name: Submit to Play Store
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.profile == 'production' && github.event.inputs.submit == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          working-directory: apps/mobile

      - name: Restore Play Console service account key
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is missing (contents of pc-api-key.json)."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > pc-api-key.json

      - name: Submit latest build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --profile production --platform android --latest --non-interactive
