name: Build SmartFit mobile (EAS)

on:
  # On every push — exactly what you asked for: every commit queues a build.
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production
      platform:
        description: "Platform to build"
        required: false
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      wait:
        description: "Wait for build to finish (false = fire-and-forget)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      submit:
        description: "Submit to Play Store after build (only for production)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  # One EAS build per ref at a time; cancel older queued runs to save credits.
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS ${{ github.event.inputs.profile || 'preview' }} / ${{ github.event.inputs.platform || 'android' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify EXPO_TOKEN secret is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create a personal/robot access token at https://expo.dev/settings/access-tokens and add it to GitHub secrets."
            exit 1
          fi
          echo "EXPO_TOKEN present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS CLI
        run: npm install -g eas-cli@latest

      - name: Show EAS account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          echo "EXPO_TOKEN length: ${#EXPO_TOKEN}"
          cd apps/mobile
          eas whoami

      - name: Trigger EAS build
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
          DEBUG: 'eas-shared:errors,eas:build'
        run: |
          set -x
          cd apps/mobile
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          PLATFORM="${{ github.event.inputs.platform || 'android' }}"
          WAIT="${{ github.event.inputs.wait }}"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          MESSAGE="$(git -C "$GITHUB_WORKSPACE" log -1 --pretty=%s | cut -c1-140) ($SHORT_SHA)"
          node --version
          which eas
          eas --version
          eas whoami
          ls -la eas.json app.config.js
          if [ "$WAIT" = "true" ]; then
            eas build \
              --profile "$PROFILE" \
              --platform "$PLATFORM" \
              --message "$MESSAGE" \
              --non-interactive \
              --wait
          else
            # Capture both stdout+stderr; do NOT fail on pipe so the file + output
            # is always visible even if eas exits non-zero.
            set +e
            eas build \
              --profile "$PROFILE" \
              --platform "$PLATFORM" \
              --message "$MESSAGE" \
              --non-interactive \
              --no-wait \
              --json > "$RUNNER_TEMP/eas-build.json" 2> "$RUNNER_TEMP/eas-build.err"
            EAS_EXIT=$?
            set -e
            echo "---- eas build exit code: $EAS_EXIT ----"
            echo "---- eas build stderr ----"
            cat "$RUNNER_TEMP/eas-build.err" || true
            echo "---- eas build stdout ----"
            cat "$RUNNER_TEMP/eas-build.json" || true
            echo

            EXPO_ACCOUNT="mouadlouhichi"
            EXPO_PROJECT="smartfit"
            export EXPO_ACCOUNT EXPO_PROJECT
            node -e '
              var fs = require("fs");
              var acct = process.env.EXPO_ACCOUNT;
              var proj = process.env.EXPO_PROJECT;
              var raw = "";
              try { raw = fs.readFileSync(process.env.RUNNER_TEMP + "/eas-build.json", "utf8"); }
              catch(e) { console.error("no stdout file"); raw = "[]"; }
              var builds = [];
              try {
                var parsed = JSON.parse(raw);
                builds = Array.isArray(parsed) ? parsed : [parsed];
              } catch(e) {
                console.error("stdout was not valid JSON: " + e.message);
                builds = [];
              }
              var lines = builds.filter(function(b){ return b && b.id; }).map(function(b){
                var prof = b.buildProfile || b.profile || "preview";
                var plat = b.platform || "?";
                return "- **" + plat + "** `" + prof + "` — [" + b.id + "](https://expo.dev/accounts/" + acct + "/projects/" + proj + "/builds/" + b.id + ")";
              });
              if (lines.length) {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                  "## EAS builds queued\n\n" + lines.join("\n") +
                  "\n\nAll builds: https://expo.dev/accounts/" + acct + "/projects/" + proj + "/builds\n");
                fs.appendFileSync(process.env.GITHUB_OUTPUT, "build_id=" + builds[0].id + "\n");
                console.log("Builds queued:" + lines.join("\n"));
                process.exit(0);
              }
              console.log("No build id returned (EAS failed)");
              process.exit(process.env.EAS_EXIT ? parseInt(process.env.EAS_EXIT, 10) : 1);
            '
          fi

  submit:
    name: Submit to Play Store
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.profile == 'production' && github.event.inputs.submit == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup EAS CLI
        run: npm install -g eas-cli@latest

      - name: Restore Play Console service account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          cd apps/mobile
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is missing (contents of pc-api-key.json)."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > pc-api-key.json

      - name: Submit latest build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd apps/mobile
          eas submit --profile production --platform android --latest --non-interactive
