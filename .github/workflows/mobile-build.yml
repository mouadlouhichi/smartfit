name: Build SmartFit mobile (EAS)

on:
  # Every push queues a build, which is what puts it on the Expo dashboard at
  # https://expo.dev/accounts/mouadlouhichi/projects/smartfit/builds
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "preview"
        type: choice
        options:
          - preview
          - production
      platform:
        description: "Platform to build"
        required: false
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      wait:
        description: "Wait for build to finish (false = fire-and-forget)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      submit:
        description: "Submit to Play Store after build (only for production)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  # One EAS build per ref at a time; cancel older queued runs to save credits.
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-hidden so actions/upload-artifact picks it up (it skips dot-dirs).
  DEBUG_DIR: eas-debug
  EXPO_ACCOUNT: mouadlouhichi
  EXPO_PROJECT: smartfit

jobs:
  build:
    name: EAS ${{ github.event.inputs.profile || 'preview' }} / ${{ github.event.inputs.platform || 'android' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify EXPO_TOKEN secret is configured
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create an access token at https://expo.dev/settings/access-tokens and add it to this repo's secrets."
            exit 1
          fi
          echo "EXPO_TOKEN present."

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # Version is taken from the root package.json "packageManager" field,
        # so never pass an explicit version here.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # `eas build` evaluates app.config.js locally before queueing, so
        # config plugins (expo-router, react-native-health-connect, …) must be
        # resolvable from apps/mobile before EAS will accept the build.
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        run: npm install -g eas-cli@latest

      - name: Show EAS account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd apps/mobile
          eas whoami

      - name: Diagnose expo config
        # Diagnostics only. EAS shells out to the local `expo config --json`
        # and swallows the child's stderr, so reproduce the same invocations
        # (EXPO_NO_DOTENV=1 included) and surface exit codes + output.
        continue-on-error: true
        run: |
          set +e
          DBG="$GITHUB_WORKSPACE/$DEBUG_DIR"
          mkdir -p "$DBG"
          EXPO_BIN="$GITHUB_WORKSPACE/node_modules/expo/bin/cli"
          REPORT="$DBG/diagnose.txt"
          : > "$REPORT"

          run_case() {
            local name="$1"; shift
            local dir="$1"; shift
            {
              echo "=================================================="
              echo "## $name"
              echo "cwd=$dir"
              echo "cmd: $*"
            } >> "$REPORT"
            ( cd "$dir" && EXPO_NO_DOTENV=1 node "$EXPO_BIN" "$@" >> "$REPORT" 2>&1 )
            echo "exit=$?" >> "$REPORT"
          }

          {
            echo "node: $(node --version)"
            echo "expo bin: $EXPO_BIN"
            ls -la "$GITHUB_WORKSPACE/node_modules/expo/bin" 2>&1
            echo "resolved expo version: $(node -p "require('$GITHUB_WORKSPACE/node_modules/expo/package.json').version" 2>&1)"
            echo "resolved @expo/cli version: $(node -p "require('$GITHUB_WORKSPACE/node_modules/@expo/cli/package.json').version" 2>&1)"
            free -m 2>&1 | head -3
          } >> "$REPORT" 2>&1

          run_case "version (from apps/mobile)" "$GITHUB_WORKSPACE/apps/mobile" --version
          run_case "config --json (from apps/mobile)" "$GITHUB_WORKSPACE/apps/mobile" config --json
          run_case "config --json (from repo root)" "$GITHUB_WORKSPACE" config --json
          run_case "config (human readable)" "$GITHUB_WORKSPACE/apps/mobile" config

          node "$GITHUB_WORKSPACE/.github/scripts/emit-annotations.cjs" \
            "$REPORT" "EXPO-DIAG" 60000 || true

      - name: Trigger EAS build
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: '1'
        run: |
          set +e
          DBG="$GITHUB_WORKSPACE/$DEBUG_DIR"
          mkdir -p "$DBG"
          cd apps/mobile

          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          PLATFORM="${{ github.event.inputs.platform || 'android' }}"
          WAIT="${{ github.event.inputs.wait }}"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          MESSAGE="$(git -C "$GITHUB_WORKSPACE" log -1 --pretty=%s | cut -c1-140) ($SHORT_SHA)"
          OUT="$DBG/eas-build.out"

          if [ "$WAIT" = "true" ]; then
            eas build \
              --profile "$PROFILE" \
              --platform "$PLATFORM" \
              --message "$MESSAGE" \
              --non-interactive \
              --wait
            exit $?
          fi

          # Fire-and-forget: queue the build and exit immediately.
          eas build \
            --profile "$PROFILE" \
            --platform "$PLATFORM" \
            --message "$MESSAGE" \
            --non-interactive \
            --no-wait \
            --json > "$OUT" 2>&1
          EAS_EXIT=$?
          echo "eas build exit: $EAS_EXIT"
          cat "$OUT"

          export EAS_EXIT OUT
          node -e '
            var fs = require("fs");
            var acct = process.env.EXPO_ACCOUNT;
            var proj = process.env.EXPO_PROJECT;
            var exitCode = process.env.EAS_EXIT || "?";

            var raw = "";
            try { raw = fs.readFileSync(process.env.OUT, "utf8"); } catch (e) { raw = ""; }
            var clean = raw.replace(/\x1b\[[0-9;]*[A-Za-z]/g, "").replace(/\r/g, "");

            // The CLI may print log lines before the JSON payload, so widen
            // the search until something parses as a build array.
            var builds = [];
            for (var start = 0; start < clean.length && !builds.length; start++) {
              var ch = clean[start];
              if (ch !== "[" && ch !== "{") continue;
              try {
                var parsed = JSON.parse(clean.slice(start));
                var list = Array.isArray(parsed) ? parsed : [parsed];
                if (list.some(function (b) { return b && b.id; })) builds = list;
              } catch (e) { /* keep scanning */ }
            }

            var links = builds.filter(function (b) { return b && b.id; }).map(function (b) {
              var profile = b.buildProfile || b.profile || "preview";
              var platform = b.platform || "?";
              return "- **" + platform + "** `" + profile + "` — [" + b.id +
                "](https://expo.dev/accounts/" + acct + "/projects/" + proj + "/builds/" + b.id + ")";
            });

            var md = "## EAS build\n\n- `eas build` exit code: `" + exitCode + "`\n\n";
            if (links.length) {
              md += "### Builds queued\n\n" + links.join("\n") + "\n\n";
              md += "All builds: https://expo.dev/accounts/" + acct + "/projects/" + proj + "/builds\n";
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, "build_id=" + builds[0].id + "\n");
              process.exit(0);
            }

            md += "### No build id returned\n\n```\n" +
              (clean.slice(-4000) || "(no output)") + "\n```\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            process.exit(exitCode === "0" ? 1 : parseInt(exitCode, 10) || 1);
          '
          NODE_EXIT=$?

          # Job logs are intermittently 503ing, so mirror the raw output into
          # annotations (readable via `gh api .../check-runs/<id>/annotations`).
          node "$GITHUB_WORKSPACE/.github/scripts/emit-annotations.cjs" "$OUT" "EAS-OUT" || true
          exit $NODE_EXIT

      - name: Upload EAS debug output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eas-debug-${{ github.run_id }}
          path: eas-debug/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 3

  submit:
    name: Submit to Play Store
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.profile == 'production' && github.event.inputs.submit == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup EAS CLI
        run: npm install -g eas-cli@latest

      - name: Restore Play Console service account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          cd apps/mobile
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON secret is missing (contents of pc-api-key.json)."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > pc-api-key.json

      - name: Submit latest build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd apps/mobile
          eas submit --profile production --platform android --latest --non-interactive
