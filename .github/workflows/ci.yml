name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Browser CI deliberately exercises the isolated demo, not a live Firebase project.
  SMARTFIT_DEPLOYMENT: demo

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # Advisory-only: the current findings live in build-time transitive deps
      # of the mobile Expo toolchain (tar, xmldom, postcss). Flip to blocking
      # once they are triaged — see docs/ops-runbook.md §Dependencies.
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  web-build:
    name: Web build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  core-tests:
    name: Unit tests (core + web lib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartfit/core test
      - run: pnpm test
      - run: pnpm test:server

  e2e:
    name: E2E smoke (production build, local mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  firestore-rules:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    # Rules are the cloud data boundary; a failed emulator test blocks merges.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # firebase-tools requires Java 21+ for the Firestore emulator
          java-version: 21
      - name: Run rules unit tests against the Firestore emulator
        run: |
          # Preserve the real exit code; expose a bounded diagnostic in check annotations
          # as well as the full job log (log-storage access may be unavailable to reviewers).
          set +e
          pnpm test:rules 2>&1 | tee /tmp/smartfit-rules.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYLOG'
          from pathlib import Path
          import re
          text = Path('/tmp/smartfit-rules.log').read_text(errors='replace')
          # GitHub truncates individual annotations. Emit failing TAP cases separately,
          # not the expected permission-denied logging from passing negative tests.
          failures = [text[m.start():].split('  ...', 1)[0][:3400] for m in re.finditer(r'(?m)^not ok ', text)]
          for index, excerpt in enumerate(failures[:10] or [text[-3400:]], 1):
              escaped = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Firestore rules failure {index}::{escaped}')
          PYLOG
          fi
          exit "$status"
      - name: Test real Auth tokens, role transactions and Firestore rules together
        run: |
          # Preserve the real exit code; expose a bounded diagnostic in check annotations
          # as well as the full job log (log-storage access may be unavailable to reviewers).
          set +e
          pnpm test:integration 2>&1 | tee /tmp/smartfit-integration.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - <<'PYLOG'
          from pathlib import Path
          import re
          text = Path('/tmp/smartfit-integration.log').read_text(errors='replace')
          # GitHub truncates individual annotations. Emit failing TAP cases separately,
          # not the expected permission-denied logging from passing negative tests.
          failures = [text[m.start():].split('  ...', 1)[0][:3400] for m in re.finditer(r'(?m)^not ok ', text)]
          for index, excerpt in enumerate(failures[:10] or [text[-3400:]], 1):
              escaped = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Firestore integration failure {index}::{escaped}')
          PYLOG
          fi
          exit "$status"
      - name: Upload emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-emulator-logs
          path: '*-debug.log'
          if-no-files-found: ignore
          retention-days: 3

  mobile-typecheck:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @smartfit/mobile typecheck
